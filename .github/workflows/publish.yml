name: Publish integration release

on:
  push:
    branches: [main]
    paths:
      - version.json
      - scripts/version.py
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and apply version
        id: version
        run: |
          version=$(python scripts/version.py --write-manifest custom_components/menstrual_cycle_companion/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit generated manifest version
        run: |
          if git diff --quiet -- custom_components/menstrual_cycle_companion/manifest.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/menstrual_cycle_companion/manifest.json
          git commit -m "chore: set integration version to ${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "$tag" \
            --generate-notes
